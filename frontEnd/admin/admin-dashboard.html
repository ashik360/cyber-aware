<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard | CyberAware</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <nav class="navbar topbar px-3">
      <a class="icon-button" href="../pages/dashboard.html" title="User Hub">
        <i class="fa-solid fa-house"></i>
      </a>
      <span class="navbar-brand fw-bold ms-2">
        <i class="fa-solid fa-screwdriver-wrench accent"></i> Admin Control
      </span>
      <a class="icon-button" href="../index.html" title="Exit">
        <i class="fa-solid fa-right-from-bracket"></i>
      </a>
    </nav>

    <main class="container stage">
      <div class="hud mb-4">
        <div class="stat-tile">
          <div class="stat-icon">
            <i class="fa-solid fa-users"></i>
          </div>
          <div>
            <div class="stat-value">120</div>
            <div class="stat-label">Total Users</div>
          </div>
        </div>
        <div class="stat-tile">
          <div class="stat-icon">
            <i class="fa-solid fa-book"></i>
          </div>
          <div>
            <div class="stat-value">8</div>
            <div class="stat-label">Modules</div>
          </div>
        </div>
        <div class="stat-tile">
          <div class="stat-icon">
            <i class="fa-solid fa-clipboard-question"></i>
          </div>
          <div>
            <div class="stat-value">350</div>
            <div class="stat-label">Quizzes</div>
          </div>
        </div>
        <div class="stat-tile">
          <div class="stat-icon">
            <i class="fa-solid fa-chart-line"></i>
          </div>
          <div>
            <div class="stat-value">65%</div>
            <div class="stat-label">Completion</div>
          </div>
        </div>
      </div>

      <div class="game-grid mb-4">
        <a class="game-tile text-decoration-none" href="manage-users.html">
          <div class="icon-circle">
            <i class="fa-solid fa-user-gear"></i>
          </div>
          <div class="fw-semibold">Manage Users</div>
          <span class="status-pill warn">Admin</span>
        </a>
        <a class="game-tile text-decoration-none" href="manage-lessons.html">
          <div class="icon-circle">
            <i class="fa-solid fa-book-open"></i>
          </div>
          <div class="fw-semibold">Manage Lessons</div>
          <span class="status-pill warn">Admin</span>
        </a>
        <a class="game-tile text-decoration-none" href="manage-quizzes.html">
          <div class="icon-circle">
            <i class="fa-solid fa-clipboard-list"></i>
          </div>
          <div class="fw-semibold">Manage Quizzes</div>
          <span class="status-pill warn">Admin</span>
        </a>
        <a class="game-tile text-decoration-none" href="analytics.html">
          <div class="icon-circle">
            <i class="fa-solid fa-chart-simple"></i>
          </div>
          <div class="fw-semibold">Analytics</div>
          <span class="status-pill warn">Admin</span>
        </a>
      </div>

      <div class="panel">
        <div class="d-flex align-items-center gap-2 mb-3">
          <i class="fa-solid fa-list accent"></i>
          <span class="fw-semibold">Recent Activity</span>
        </div>
        <ul class="list-group">
          <li class="list-group-item">New user registered</li>
          <li class="list-group-item">Quiz added: Password Security</li>
          <li class="list-group-item">User completed Beginner Level</li>
          <li class="list-group-item">Lesson published: Phishing Awareness</li>
        </ul>
      </div>
    </main>
  </body>
</html>
