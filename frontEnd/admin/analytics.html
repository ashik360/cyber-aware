<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Analytics | CyberAware Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <nav class="navbar topbar px-3">
      <a class="icon-button" href="admin-dashboard.html" title="Admin Home">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <span class="navbar-brand fw-bold ms-2">
        <i class="fa-solid fa-chart-simple accent"></i> Analytics
      </span>
    </nav>

    <main class="container stage">
      <div class="hud mb-4">
        <div class="stat-tile">
          <div class="stat-icon"><i class="fa-solid fa-user-clock"></i></div>
          <div>
            <div class="stat-value">42m</div>
            <div class="stat-label">Avg Session</div>
          </div>
        </div>
        <div class="stat-tile">
          <div class="stat-icon"><i class="fa-solid fa-ranking-star"></i></div>
          <div>
            <div class="stat-value">3.8</div>
            <div class="stat-label">Avg Score</div>
          </div>
        </div>
        <div class="stat-tile">
          <div class="stat-icon"><i class="fa-solid fa-percent"></i></div>
          <div>
            <div class="stat-value">64%</div>
            <div class="stat-label">Completion</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="d-flex align-items-center gap-2 mb-3">
          <i class="fa-solid fa-chart-line accent"></i>
          <span class="fw-semibold">Engagement Insights</span>
        </div>
        <p class="text-muted mb-0">
          Charts and detailed analytics will be connected after backend
          integration.
        </p>
      </div>
    </main>
  </body>
</html>
