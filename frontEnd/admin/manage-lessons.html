<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Manage Lessons | CyberAware Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <nav class="navbar topbar px-3">
      <a class="icon-button" href="admin-dashboard.html" title="Admin Home">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <span class="navbar-brand fw-bold ms-2">
        <i class="fa-solid fa-book-open accent"></i> Manage Lessons
      </span>
    </nav>

    <main class="container stage">
      <div class="panel mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="fw-semibold">Lesson Library</div>
          <button class="btn btn-glow btn-sm">Add Lesson</button>
        </div>
        <table class="table table-dark table-hover mb-0">
          <thead>
            <tr>
              <th>Title</th>
              <th>Level</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Phishing Basics</td>
              <td>Beginner</td>
              <td>Published</td>
            </tr>
            <tr>
              <td>Password Hygiene</td>
              <td>Beginner</td>
              <td>Published</td>
            </tr>
            <tr>
              <td>Social Engineering</td>
              <td>Intermediate</td>
              <td>Draft</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
