<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Social Shield | CyberAware</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <nav class="navbar topbar px-3">
      <a class="icon-button" href="dashboard.html" title="Back to Hub">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <span class="navbar-brand fw-bold ms-2">
        <i class="fa-solid fa-user-secret accent"></i> Social Shield
      </span>
      <span class="status-pill warn">Decision</span>
    </nav>

    <main class="container stage">
      <div class="panel glass mb-3">
        <div class="d-flex align-items-center gap-3">
          <div class="icon-circle">
            <i class="fa-solid fa-phone"></i>
          </div>
          <div>
            <div class="fw-semibold">Incoming call</div>
            <div class="text-muted small">Choose the safest response.</div>
          </div>
        </div>
      </div>

      <div class="panel mb-4">
        <div class="panel glass">
          <p class="mb-2"><strong>Caller:</strong> "This is IT. We need your login now."</p>
          <p class="text-muted mb-0">
            The caller sounds urgent and asks for credentials.
          </p>
        </div>
      </div>

      <div class="panel mb-4">
        <div class="d-flex align-items-center gap-2 mb-3">
          <i class="fa-solid fa-headset warning"></i>
          <span class="fw-semibold">Your response</span>
        </div>
        <div class="list-group">
          <label class="list-group-item">
            <input class="form-check-input me-2" type="radio" name="socialChoice" data-correct="false" />
            Share credentials to avoid disruption
          </label>
          <label class="list-group-item">
            <input class="form-check-input me-2" type="radio" name="socialChoice" data-correct="false" />
            Ask for ID and continue the call
          </label>
          <label class="list-group-item">
            <input class="form-check-input me-2" type="radio" name="socialChoice" data-correct="true" />
            End the call and report to security
          </label>
          <label class="list-group-item">
            <input class="form-check-input me-2" type="radio" name="socialChoice" data-correct="false" />
            Ignore and do nothing
          </label>
        </div>
      </div>

      <div class="panel text-center">
        <button id="submitSocial" class="btn btn-glow">Submit</button>
        <div id="result" class="result-box mt-3"></div>
      </div>
    </main>

    <script src="../assets/js/progress.js"></script>
    <script src="../assets/js/social.js"></script>
  </body>
</html>
