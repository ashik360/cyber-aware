<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Register | CyberAware</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <nav class="navbar topbar px-3">
      <a class="icon-button" href="../index.html" title="Home">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <span class="navbar-brand fw-bold ms-2">
        <i class="fa-solid fa-user-plus accent"></i> Create Account
      </span>
      <a class="btn btn-glow btn-sm" href="dashboard.html">Demo Hub</a>
    </nav>

    <main class="container stage">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="panel glass">
            <div class="d-flex align-items-center gap-3 mb-3">
              <div class="icon-circle">
                <i class="fa-solid fa-shield"></i>
              </div>
              <div>
                <div class="fw-semibold">Join the Training</div>
                <div class="text-muted small">Create your profile.</div>
              </div>
            </div>

            <form>
              <div class="mb-3">
                <label class="form-label text-muted small">Full Name</label>
                <input type="text" class="form-control" placeholder="Full name" />
              </div>

              <div class="mb-3">
                <label class="form-label text-muted small">Email</label>
                <input type="email" class="form-control" placeholder="you@company.com" />
              </div>

              <div class="mb-3">
                <label class="form-label text-muted small">Password</label>
                <input type="password" class="form-control" placeholder="Create password" />
              </div>

              <div class="mb-4">
                <label class="form-label text-muted small">Confirm Password</label>
                <input type="password" class="form-control" placeholder="Repeat password" />
              </div>

              <button class="btn btn-glow w-100">Register</button>
            </form>

            <div class="text-center mt-3 text-muted small">
              Already have an account?
              <a href="login.html" class="accent">Login</a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
