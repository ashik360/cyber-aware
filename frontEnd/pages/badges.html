<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Badges | CyberAware</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body class="scanlines">
    <nav class="navbar topbar px-3">
      <a class="icon-button" href="dashboard.html" title="Back to Hub">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <span class="navbar-brand fw-bold ms-2">
        <i class="fa-solid fa-award accent"></i> Badges
      </span>
      <div class="quick-nav ms-auto">
        <a class="icon-button" href="profile.html" title="Profile">
          <i class="fa-solid fa-user-astronaut"></i>
        </a>
        <a class="icon-button" href="certificates.html" title="Certificates">
          <i class="fa-solid fa-certificate"></i>
        </a>
        <a class="icon-button" href="notifications.html" title="Notifications">
          <i class="fa-solid fa-bell"></i>
        </a>
        <a class="icon-button" href="leaderboard.html" title="Leaderboard">
          <i class="fa-solid fa-trophy"></i>
        </a>
      </div>
    </nav>

    <main class="container stage">
      <div class="game-grid">
        <div class="game-tile">
          <div class="icon-circle accent">
            <i class="fa-solid fa-envelope-circle-check"></i>
          </div>
          <div class="fw-semibold">Phishing Defender</div>
          <div class="text-muted small">Rarity: <span class="rarity-rare">Rare</span></div>
          <span class="status-pill success">Unlocked</span>
        </div>

        <div class="game-tile">
          <div class="icon-circle accent">
            <i class="fa-solid fa-key"></i>
          </div>
          <div class="fw-semibold">Password Master</div>
          <div class="text-muted small">Rarity: <span class="rarity-epic">Epic</span></div>
          <span class="status-pill success">Unlocked</span>
        </div>

        <div class="game-tile">
          <div class="icon-circle">
            <i class="fa-solid fa-bug"></i>
          </div>
          <div class="fw-semibold">Malware Hunter</div>
          <div class="text-muted small">Rarity: <span class="rarity-rare">Rare</span></div>
          <span class="status-pill warn">In Progress</span>
        </div>

        <div class="game-tile">
          <div class="icon-circle">
            <i class="fa-solid fa-user-secret"></i>
          </div>
          <div class="fw-semibold">Social Shield</div>
          <div class="text-muted small">Rarity: <span class="rarity-legendary">Legendary</span></div>
          <span class="status-pill locked">Locked</span>
        </div>
      </div>
    </main>
  </body>
</html>
