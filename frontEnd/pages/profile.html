<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Profile | CyberAware</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <nav class="navbar topbar px-3">
      <a class="icon-button" href="dashboard.html" title="Back to Hub">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <span class="navbar-brand fw-bold ms-2">
        <i class="fa-solid fa-user-astronaut accent"></i> Profile
      </span>
      <div class="quick-nav ms-auto">
        <a class="icon-button" href="badges.html" title="Badges">
          <i class="fa-solid fa-award"></i>
        </a>
        <a class="icon-button" href="certificates.html" title="Certificates">
          <i class="fa-solid fa-certificate"></i>
        </a>
        <a class="icon-button" href="notifications.html" title="Notifications">
          <i class="fa-solid fa-bell"></i>
        </a>
        <a class="icon-button" href="leaderboard.html" title="Leaderboard">
          <i class="fa-solid fa-trophy"></i>
        </a>
      </div>
    </nav>

    <main class="container stage">
      <div class="panel glass mb-4">
        <div class="d-flex align-items-center gap-3">
          <div class="icon-circle">
            <i class="fa-solid fa-user"></i>
          </div>
          <div>
            <div class="fw-semibold">Student User</div>
            <div class="text-muted small">Level: Beginner</div>
          </div>
          <div class="ms-auto">
            <span class="status-pill success">Member</span>
          </div>
        </div>
      </div>

      <div class="hud mb-4">
        <div class="stat-tile">
          <div class="stat-icon">
            <i class="fa-solid fa-bolt"></i>
          </div>
          <div>
            <div class="stat-value">1100</div>
            <div class="stat-label">Total Score</div>
          </div>
        </div>
        <div class="stat-tile">
          <div class="stat-icon">
            <i class="fa-solid fa-medal"></i>
          </div>
          <div>
            <div class="stat-value">2</div>
            <div class="stat-label">Badges</div>
          </div>
        </div>
        <div class="stat-tile">
          <div class="stat-icon">
            <i class="fa-solid fa-flag-checkered"></i>
          </div>
          <div>
            <div class="stat-value">4</div>
            <div class="stat-label">Modules</div>
          </div>
        </div>
      </div>

      <div class="panel mb-4">
        <div class="d-flex align-items-center gap-2 mb-2">
          <i class="fa-solid fa-timeline accent"></i>
          <span class="fw-semibold">Recent Activity</span>
        </div>
        <ul class="list-group">
          <li class="list-group-item">Completed Phishing Trap</li>
          <li class="list-group-item">Passed Password Forge</li>
          <li class="list-group-item">Malware Radar in progress</li>
        </ul>
      </div>
    </main>
  </body>
</html>
