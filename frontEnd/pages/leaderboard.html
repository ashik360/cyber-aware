<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Leaderboard | CyberAware</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <nav class="navbar topbar px-3">
      <a class="icon-button" href="dashboard.html" title="Back to Hub">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <span class="navbar-brand fw-bold ms-2">
        <i class="fa-solid fa-trophy accent"></i> Leaderboard
      </span>
      <div class="quick-nav ms-auto">
        <a class="icon-button" href="profile.html" title="Profile">
          <i class="fa-solid fa-user-astronaut"></i>
        </a>
        <a class="icon-button" href="badges.html" title="Badges">
          <i class="fa-solid fa-award"></i>
        </a>
        <a class="icon-button" href="certificates.html" title="Certificates">
          <i class="fa-solid fa-certificate"></i>
        </a>
        <a class="icon-button" href="notifications.html" title="Notifications">
          <i class="fa-solid fa-bell"></i>
        </a>
      </div>
    </nav>

    <main class="container stage">
      <div class="panel mb-4">
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <div class="text-muted small">Your Score</div>
            <div id="yourScore" class="stat-value">0</div>
          </div>
          <span class="status-pill success">
            <i class="fa-solid fa-star"></i> Demo
          </span>
        </div>
      </div>

      <div class="panel">
        <table class="table table-dark table-hover mb-0">
          <thead>
            <tr>
              <th>Rank</th>
              <th>User</th>
              <th>Level</th>
              <th>Score</th>
              <th>Badges</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>#1</td>
              <td>Rakib</td>
              <td>Beginner</td>
              <td>1250</td>
              <td>3</td>
            </tr>
            <tr>
              <td>#2</td>
              <td>Kabir</td>
              <td>Beginner</td>
              <td>1100</td>
              <td>2</td>
            </tr>
            <tr>
              <td>#3</td>
              <td>User123</td>
              <td>Beginner</td>
              <td>980</td>
              <td>2</td>
            </tr>
            <tr>
              <td>#4</td>
              <td>User456</td>
              <td>Beginner</td>
              <td>850</td>
              <td>1</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <script src="../assets/js/progress.js"></script>
    <script src="../assets/js/leaderboard.js"></script>
  </body>
</html>
