<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Assessment | CyberAware</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <nav class="navbar topbar px-3">
      <a class="icon-button" href="dashboard.html" title="Back to Hub">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <span class="navbar-brand fw-bold ms-2">
        <i class="fa-solid fa-clipboard-question accent"></i> Quick Assessment
      </span>
      <div class="quick-nav ms-auto">
        <a class="icon-button" href="lesson.html" title="Lesson">
          <i class="fa-solid fa-book-open"></i>
        </a>
        <a class="icon-button" href="profile.html" title="Profile">
          <i class="fa-solid fa-user-astronaut"></i>
        </a>
        <a class="icon-button" href="badges.html" title="Badges">
          <i class="fa-solid fa-award"></i>
        </a>
        <a class="icon-button" href="leaderboard.html" title="Leaderboard">
          <i class="fa-solid fa-trophy"></i>
        </a>
      </div>
    </nav>

    <main class="container stage">
      <div class="panel mb-4">
        <div class="d-flex align-items-center gap-2 mb-3">
          <i class="fa-solid fa-bolt warning"></i>
          <span class="fw-semibold">Phishing & Email Threats</span>
        </div>
        <div class="mb-3">
          <div class="text-muted small">Question 1</div>
          <div class="fw-semibold">What is phishing?</div>
          <div class="mt-2">
            <label class="list-group-item">
              <input class="form-check-input me-2" type="radio" name="q1" />
              A type of malware
            </label>
            <label class="list-group-item">
              <input class="form-check-input me-2" type="radio" name="q1" />
              A fake communication to steal data
            </label>
            <label class="list-group-item">
              <input class="form-check-input me-2" type="radio" name="q1" />
              A firewall technique
            </label>
          </div>
        </div>

        <div class="mb-4">
          <div class="text-muted small">Question 2</div>
          <div class="fw-semibold">Which is a sign of phishing?</div>
          <div class="mt-2">
            <label class="list-group-item">
              <input class="form-check-input me-2" type="radio" name="q2" />
              Correct domain name
            </label>
            <label class="list-group-item">
              <input class="form-check-input me-2" type="radio" name="q2" />
              Urgent action request
            </label>
            <label class="list-group-item">
              <input class="form-check-input me-2" type="radio" name="q2" />
              Official logo only
            </label>
          </div>
        </div>

        <a href="quiz-result.html" class="btn btn-glow w-100">Submit</a>
      </div>
    </main>
  </body>
</html>
