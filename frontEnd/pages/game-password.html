<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Password Forge | CyberAware</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <nav class="navbar topbar px-3">
      <a class="icon-button" href="dashboard.html" title="Back to Hub">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <span class="navbar-brand fw-bold ms-2">
        <i class="fa-solid fa-key accent"></i> Password Forge
      </span>
      <span class="status-pill warn">10 points</span>
    </nav>

    <main class="container stage">
      <div class="panel glass mb-3">
        <div class="d-flex align-items-center gap-3">
          <div class="icon-circle">
            <i class="fa-solid fa-lock"></i>
          </div>
          <div>
            <div class="fw-semibold">Craft a strong password</div>
            <div class="text-muted small">Hit all five security rules.</div>
          </div>
        </div>
      </div>

      <div class="panel mb-4">
        <input
          type="password"
          id="passwordInput"
          class="form-control form-control-lg"
          placeholder="Type a secure password"
        />
        <div class="mt-3">
          <span class="text-muted small">Strength</span>
          <span id="strengthText" class="fw-semibold ms-2"></span>
        </div>
        <div class="progress mt-2">
          <div id="strengthBar" class="progress-bar"></div>
        </div>
      </div>

      <div class="panel mb-4">
        <div class="d-flex align-items-center gap-2 mb-3">
          <i class="fa-solid fa-shield warning"></i>
          <span class="fw-semibold">Rules</span>
        </div>
        <ul class="list-group">
          <li id="rule-length" class="list-group-item d-flex justify-content-between text-muted">
            10+ characters
            <span>Missing</span>
          </li>
          <li id="rule-upper" class="list-group-item d-flex justify-content-between text-muted">
            Uppercase
            <span>Missing</span>
          </li>
          <li id="rule-lower" class="list-group-item d-flex justify-content-between text-muted">
            Lowercase
            <span>Missing</span>
          </li>
          <li id="rule-number" class="list-group-item d-flex justify-content-between text-muted">
            Number
            <span>Missing</span>
          </li>
          <li id="rule-symbol" class="list-group-item d-flex justify-content-between text-muted">
            Symbol
            <span>Missing</span>
          </li>
        </ul>
      </div>

      <div class="panel text-center">
        <button id="submitPassword" class="btn btn-glow">Submit</button>
        <div id="result" class="result-box mt-3"></div>
      </div>
    </main>

    <script src="../assets/js/progress.js"></script>
    <script src="../assets/js/password.js"></script>
  </body>
</html>
