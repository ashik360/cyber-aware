<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Certificates | CyberAware</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <nav class="navbar topbar px-3">
      <a class="icon-button" href="dashboard.html" title="Back to Hub">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <span class="navbar-brand fw-bold ms-2">
        <i class="fa-solid fa-certificate accent"></i> Certificates
      </span>
      <div class="quick-nav ms-auto">
        <a class="icon-button" href="profile.html" title="Profile">
          <i class="fa-solid fa-user-astronaut"></i>
        </a>
        <a class="icon-button" href="badges.html" title="Badges">
          <i class="fa-solid fa-award"></i>
        </a>
        <a class="icon-button" href="notifications.html" title="Notifications">
          <i class="fa-solid fa-bell"></i>
        </a>
        <a class="icon-button" href="leaderboard.html" title="Leaderboard">
          <i class="fa-solid fa-trophy"></i>
        </a>
      </div>
    </nav>

    <main class="container stage">
      <div class="game-grid">
        <div class="game-tile">
          <div class="icon-circle">
            <i class="fa-solid fa-seedling"></i>
          </div>
          <div class="fw-semibold">Beginner Level</div>
          <span class="status-pill success">Completed</span>
        </div>
        <div class="game-tile">
          <div class="icon-circle">
            <i class="fa-solid fa-network-wired"></i>
          </div>
          <div class="fw-semibold">Intermediate Level</div>
          <span class="status-pill warn">In Progress</span>
        </div>
        <div class="game-tile">
          <div class="icon-circle">
            <i class="fa-solid fa-shield-virus"></i>
          </div>
          <div class="fw-semibold">Advanced Level</div>
          <span class="status-pill locked">Locked</span>
        </div>
      </div>

      <div class="panel glass mt-4 text-center">
        <div class="icon-circle mx-auto mb-3">
          <i class="fa-solid fa-file-lines"></i>
        </div>
        <h4 class="mb-2">Certificate Preview</h4>
        <p class="text-muted">
          Certificate downloads will unlock after backend integration.
        </p>
        <button class="btn btn-ghost" disabled>Download PDF</button>
      </div>
    </main>
  </body>
</html>
